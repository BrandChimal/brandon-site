<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Brand Decision System · Discovery v0.6</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#171717;--muted:#6f6b64;--line:#ddd7cb;--soft:#ece8df;--accent:#171717;--r:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}
.shell{width:min(800px,100%);min-height:100vh;margin:auto;padding:20px 18px max(34px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.progress-label{font-size:13px;color:var(--muted)}.progress{height:6px;background:#e8e4dc;border-radius:99px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--ink);width:0;transition:.2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,5vw,42px);box-shadow:0 10px 35px rgba(20,18,14,.045);flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:13px}.context{display:inline-flex;align-self:flex-start;background:var(--soft);padding:8px 11px;border-radius:999px;font-size:12px;color:#514e48;margin-bottom:14px;line-height:1.3}.context strong{font-weight:800}h1{font-size:clamp(31px,7vw,50px);line-height:1.04;letter-spacing:-.035em;margin:0 0 17px}h2{font-size:clamp(25px,5.7vw,38px);line-height:1.12;letter-spacing:-.025em;margin:0 0 10px}.lead{font-size:16px;line-height:1.55;color:var(--muted);margin:0 0 20px}.helper{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 16px}
input[type=text],input[type=email],textarea{width:100%;border:1px solid #cec8bc;border-radius:15px;padding:15px 16px;background:#fff;color:var(--ink);outline:none}textarea{min-height:135px;resize:vertical;line-height:1.5}input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,23,.07)}
.options{display:grid;gap:10px;margin:14px 0}.option{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border:1px solid #cec8bc;border-radius:15px;background:#fff;cursor:pointer}.option:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 2px rgba(23,23,23,.05);background:#fbfaf7}.option input{width:auto;margin-top:3px}.option span{line-height:1.35}.multi-note{font-size:12px;color:var(--muted);margin:2px 0 10px}.detail{margin-top:18px;padding-top:17px;border-top:1px solid var(--soft)}.detail label{display:block;font-size:14px;font-weight:750;margin-bottom:8px}.detail p{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 10px}
.category-box{background:#f8f6f1;border:1px solid var(--line);border-radius:16px;padding:16px}.category-box strong{display:block;margin-bottom:7px}.category-edit{margin-top:14px}.category-edit label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}
.nav{display:flex;gap:10px;align-items:center;margin-top:20px}.btn{border:0;border-radius:999px;padding:13px 18px;cursor:pointer;font-weight:720}.btn.primary{background:var(--ink);color:#fff;margin-left:auto}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn[disabled]{opacity:.45;cursor:not-allowed}.status{font-size:12px;color:var(--muted);margin-left:auto}.error{display:none;color:#8c2323;font-size:13px;margin-top:10px}.retry{margin-top:16px}.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:14px}.success .mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font-size:26px;margin-bottom:22px}
@media(max-width:520px){.shell{padding-top:16px}.card{min-height:calc(100vh - 148px)}}
</style>
</head>
<body>
<div class="shell">
 <div class="top"><div class="brand">Brand Decision System</div><div id="progressLabel" class="progress-label"></div></div>
 <div class="progress"><div id="progressBar"></div></div>
 <main id="card" class="card"></main>
 <div id="nav" class="nav"><button id="backBtn" class="btn secondary">Atrás</button><span id="status" class="status">Guardado local</span><button id="nextBtn" class="btn primary">Continuar</button></div>
</div>
<script>
const API='/api/discovery-v06?key=bds-v06-test';
const STORE='bds_semantic_discovery_v06';
const INTENTS=['job','trigger','barrier','customer_language','alternatives','mechanism','proof','category_tension','brand_best_self','principle'];
const LABELS={job:'Lo que buscaba el cliente',trigger:'Por qué fue en ese momento',barrier:'Qué podía cambiar la decisión',customer_language:'Cómo lo expresa el cliente',alternatives:'Qué habría hecho sin ti',mechanism:'Cómo produces valor',proof:'Qué evidencia tienes',category_tension:'Qué falla en la categoría',brand_best_self:'Tu mejor forma de trabajar',principle:'Lo que no sacrificarías'};
let state=JSON.parse(localStorage.getItem(STORE)||'{}');state.answers||={};state.generated||={};state.category_profile||=null;state.category_confirmed??=false;let index=Number(state.__index||0);

const base=[
{id:'intro',type:'intro',title:'Primero entendemos tu negocio. Luego te preguntamos solo lo que necesitamos.',lead:'Esta versión no usa ejemplos fijos por industria. Cada pregunta se genera a partir de tu oferta, tu categoría y una compra real.'},
{id:'respondent_name',type:'text',section:'Sobre ti',q:'¿Cómo te llamas?',required:true},
{id:'respondent_email',type:'email',section:'Sobre ti',q:'¿Quieres dejar un email de contacto?',lead:'Opcional.',required:false},
{id:'business_name',type:'text',section:'Tu negocio',q:'¿Cómo se llama tu negocio o proyecto?',required:true},
{id:'offer',type:'textarea',section:'Tu negocio',q:'¿Qué vendes o qué haces por tus clientes?',lead:'Cuéntalo como se lo explicarías a alguien que acaba de conocerte.',required:true},
{id:'payer_mode',type:'choice',section:'Tu negocio',q:'¿Quién suele comprar o pagar por lo que ofreces?',options:['Personas','Empresas u organizaciones','Ambos','Todavía no tengo clientes'],required:true},
{id:'recent_purchase',type:'text',section:'Una compra real',q:'Piensa en una venta reciente. ¿Qué compró exactamente ese cliente?',lead:'Ejemplo de formato, no de contenido: “dos lámparas de pared”, “una asesoría”, “unos tenis deportivos”.',required:true},
{id:'purchase_purpose',type:'textarea',section:'Una compra real',q:'¿Para qué lo quería?',lead:'Escribe lo que recuerdes de esa compra. No necesitas explicarlo con palabras de marketing.',required:true},
{id:'category_confirm',type:'category'}
];
const tail=[{id:'feedback',type:'textarea',section:'Sobre esta prueba',q:'¿Hubo alguna pregunta u opción que no encajara con tu negocio o sonara rara?',lead:'Si todo tuvo sentido, escribe “todo encajó”.',required:true},{id:'review',type:'review',title:'Listo para enviar.',lead:'Tus respuestas y las preguntas generadas se guardarán para evaluar precisión, naturalidad y personalización.'}];
function steps(){return [...base,...INTENTS.map(id=>({id,type:'generated'})),...tail]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(){state.__index=index;localStorage.setItem(STORE,JSON.stringify(state));status.textContent='Guardado local'}
function current(){const s=steps();index=Math.min(index,s.length-1);return s[index]}
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||data.error||`HTTP ${r.status}`);return data}
function businessContext(){return {business_name:state.answers.business_name||'',offer:state.answers.offer||'',payer_mode:state.answers.payer_mode||''}}
function purchaseEpisode(){return {recent_purchase:state.answers.recent_purchase||'',purpose:state.answers.purchase_purpose||''}}
function knownEvidence(){const out={};for(const id of INTENTS){if(state.answers[id])out[id]=state.answers[id]}return out}
function respondentVocabulary(){return [state.answers.offer,state.answers.recent_purchase,state.answers.purchase_purpose,...Object.values(knownEvidence()).flatMap(v=>typeof v==='string'?[v]:Array.isArray(v?.selected)?v.selected:[])].filter(Boolean).slice(0,20)}

async function ensureCategory(){if(state.category_profile)return;card.innerHTML='<div class="loading"><span class="dot"></span> Entendiendo el negocio y la categoría…</div>';nav.style.visibility='hidden';try{state.category_profile=await post({action:'infer_context',...businessContext(),recent_purchase:state.answers.recent_purchase||''});save()}catch(e){card.innerHTML=`<div class="eyebrow">No pudimos interpretar el contexto</div><h2>Necesitamos intentarlo otra vez.</h2><p class="lead">${esc(e.message)}</p><button class="btn primary retry" onclick="state.category_profile=null;render()">Reintentar</button>`;return false}finally{nav.style.visibility='visible'}return true}
async function ensureQuestion(id){if(state.generated[id])return true;card.innerHTML='<div class="loading"><span class="dot"></span> Preparando una pregunta para este caso…</div>';nav.style.visibility='hidden';try{state.generated[id]=await post({action:'generate_question',strategic_intent:id,business_context:businessContext(),category_profile:state.category_profile,purchase_episode:purchaseEpisode(),known_evidence:knownEvidence(),respondent_vocabulary:respondentVocabulary()});save()}catch(e){card.innerHTML=`<div class="eyebrow">La pregunta no pasó la validación</div><h2>No te voy a mostrar una opción genérica.</h2><p class="lead">${esc(e.message)}</p><button class="btn primary retry" onclick="delete state.generated['${id}'];render()">Generar de nuevo</button>`;return false}finally{nav.style.visibility='visible'}return true}

function input(step){const v=state.answers[step.id]??'';if(step.type==='text'||step.type==='email')return `<input id="field" type="${step.type}" value="${esc(v)}" placeholder="${step.required===false?'Opcional':'Escribe aquí…'}">`;if(step.type==='textarea')return `<textarea id="field" placeholder="Escribe con tus palabras…">${esc(v)}</textarea>`;if(step.type==='choice')return `<div class="options">${step.options.map(o=>`<label class="option"><input type="radio" name="choice" value="${esc(o)}" ${v===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;return ''}
function dynamicInput(id,q){const mode=q.selection_mode;state.answers[id] ||= mode==='free_text'?'':{selected:[],detail:''};if(mode==='free_text'){return `<textarea id="dynamicText" placeholder="Escribe lo que recuerdes. Si no recuerdas nada, dilo así.">${esc(state.answers[id]||'')}</textarea>`}const a=state.answers[id];const type=mode==='multi'?'checkbox':'radio';return `${mode==='multi'?'<div class="multi-note">Puedes elegir varias.</div>':''}<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${type}" name="dynamicChoice" value="${esc(o)}" ${a.selected?.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div><div class="detail"><label>¿Qué viste, escuchaste o recuerdas en ese caso?</label><p>Las opciones solo orientan. Este ejemplo es la parte que más nos ayuda a no inventar.</p><textarea id="dynamicDetail" placeholder="Ejemplo o aclaración breve…">${esc(a.detail||'')}</textarea></div>`}
function contextCue(q){const cat=state.category_profile?.category_label||'';return q?.context_cue||`${state.answers.recent_purchase||'Compra reciente'}${cat?' · '+cat:''}`}

async function render(){const s=steps();index=Math.min(index,s.length-1);const step=s[index];const pct=step.type==='intro'?0:step.type==='review'?100:Math.round(Math.max(0,index-1)/(s.length-2)*100);progressBar.style.width=pct+'%';progressLabel.textContent=step.type==='intro'?'Inicio':step.type==='review'?'Listo para enviar':`${Math.max(0,index-1)} / ${s.length-2}`;
 if(step.type==='category'){const ok=await ensureCategory();if(!ok)return;const c=state.category_profile;card.innerHTML=`<div class="eyebrow">Antes de seguir</div><h2>Quiero comprobar que entendí tu negocio.</h2><div class="category-box"><strong>${esc(c.confirmation||'')}</strong><div class="category-edit"><label>Si esta categoría no te representa, corrígela:</label><input id="categoryEdit" type="text" value="${esc(c.category_label||'')}"></div></div><p class="note">Esto solo sirve para que las siguientes preguntas y opciones tengan sentido en tu categoría. No lo trataremos como evidencia sobre tu cliente.</p><div id="error" class="error">Confirma o corrige la categoría para continuar.</div>`;bindCategory();
 }else if(step.type==='generated'){const ok=await ensureQuestion(step.id);if(!ok)return;const q=state.generated[step.id];card.innerHTML=`<div class="context">${esc(contextCue(q))}</div><div class="eyebrow">${esc(LABELS[step.id])}</div><h2>${esc(q.question)}</h2>${q.helper?`<p class="helper">${esc(q.helper)}</p>`:''}${dynamicInput(step.id,q)}<div id="error" class="error">Selecciona o escribe una respuesta para continuar.</div>`;bindDynamic(step.id,q);
 }else if(step.type==='intro'||step.type==='review'){card.innerHTML=`<div class="eyebrow">${step.type==='intro'?'Discovery semántico · v0.6':'Antes de enviar'}</div><h1>${esc(step.title)}</h1><p class="lead">${esc(step.lead)}</p>`;
 }else{card.innerHTML=`<div class="eyebrow">${esc(step.section||'')}</div><h2>${esc(step.q)}</h2>${step.lead?`<p class="lead">${esc(step.lead)}</p>`:''}${input(step)}<div id="error" class="error">Completa esta respuesta para continuar.</div>`;bindBase(step)}
 backBtn.style.visibility=index===0?'hidden':'visible';nextBtn.textContent=step.type==='review'?'Enviar respuestas':index===0?'Comenzar':'Continuar';status.style.visibility=(step.type==='intro'||step.type==='review')?'hidden':'visible';window.scrollTo({top:0,behavior:'smooth'});
}
function bindBase(step){const f=document.getElementById('field');if(f)f.addEventListener('input',e=>{state.answers[step.id]=e.target.value;if(['offer','recent_purchase','payer_mode'].includes(step.id)){state.category_profile=null;state.generated={}}save()});document.querySelectorAll('input[name="choice"]').forEach(el=>el.addEventListener('change',e=>{state.answers[step.id]=e.target.value;if(['offer','recent_purchase','payer_mode'].includes(step.id)){state.category_profile=null;state.generated={}}save()}))}
function bindCategory(){const e=document.getElementById('categoryEdit');e.addEventListener('input',x=>{state.category_profile.category_label=x.target.value;state.category_confirmed=true;state.generated={};save()})}
function bindDynamic(id,q){if(q.selection_mode==='free_text'){document.getElementById('dynamicText').addEventListener('input',e=>{state.answers[id]=e.target.value;save()});return}document.querySelectorAll('input[name="dynamicChoice"]').forEach(el=>el.addEventListener('change',e=>{const a=state.answers[id]||{selected:[],detail:''};if(q.selection_mode==='multi'){a.selected=e.target.checked?[...new Set([...(a.selected||[]),e.target.value])]:(a.selected||[]).filter(x=>x!==e.target.value)}else{a.selected=[e.target.value]}state.answers[id]=a;save()}));document.getElementById('dynamicDetail').addEventListener('input',e=>{const a=state.answers[id]||{selected:[],detail:''};a.detail=e.target.value;state.answers[id]=a;save()})}
function valid(){const step=current();if(step.type==='intro'||step.type==='review'||step.required===false)return true;if(step.type==='category')return Boolean(state.category_profile?.category_label?.trim());if(step.type==='generated'){const q=state.generated[step.id];const a=state.answers[step.id];if(q?.selection_mode==='free_text')return typeof a==='string'&&a.trim();return Array.isArray(a?.selected)&&a.selected.length>0}const v=state.answers[step.id];return typeof v==='string'&&v.trim()}
async function submit(){nextBtn.disabled=true;backBtn.disabled=true;nextBtn.textContent='Enviando…';try{const result=await post({action:'submit',respondent_name:state.answers.respondent_name||null,respondent_email:state.answers.respondent_email||null,business_name:state.answers.business_name||null,route_profile:{category_profile:state.category_profile},answers:{...state.answers,__generated_questions:state.generated},comprehension:{mode:'semantic_personalizer_v06'},metadata:{submitted_at:new Date().toISOString(),user_agent:navigator.userAgent}});localStorage.removeItem(STORE);nav.style.display='none';progressBar.style.width='100%';progressLabel.textContent='Enviado';card.innerHTML=`<div class="success"><div class="mark">✓</div><div class="eyebrow">Respuestas recibidas</div><h1>Gracias. Ya terminaste.</h1><p class="lead">También guardamos las preguntas y opciones que el sistema generó para revisar si realmente encajaron con tu negocio.</p></div>`}catch(e){nextBtn.disabled=false;backBtn.disabled=false;nextBtn.textContent='Intentar de nuevo';alert('No pudimos enviar. Tus respuestas siguen guardadas en este dispositivo.')}}
const card=document.getElementById('card'),nav=document.getElementById('nav'),backBtn=document.getElementById('backBtn'),nextBtn=document.getElementById('nextBtn'),progressBar=document.getElementById('progressBar'),progressLabel=document.getElementById('progressLabel'),status=document.getElementById('status');
nextBtn.addEventListener('click',async()=>{if(!valid()){const e=document.getElementById('error');if(e)e.style.display='block';return}if(current().type==='review')return submit();index=Math.min(index+1,steps().length-1);save();await render()});backBtn.addEventListener('click',async()=>{index=Math.max(0,index-1);save();await render()});render();
</script>
</body>
</html>
