<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brand Decision System · Discovery v0.6</title><style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#171717;--muted:#6f6b64;--line:#ddd7cb;--soft:#ece8df}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}.shell{width:min(800px,100%);min-height:100vh;margin:auto;padding:20px 18px 34px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.progress-label,.status{font-size:12px;color:var(--muted)}.progress{height:6px;background:#e8e4dc;border-radius:99px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--ink);width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 10px 35px rgba(20,18,14,.045);flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:13px}.context{display:inline-flex;align-self:flex-start;background:var(--soft);padding:8px 11px;border-radius:999px;font-size:12px;color:#514e48;margin-bottom:14px}h1{font-size:clamp(31px,7vw,50px);line-height:1.04;letter-spacing:-.035em;margin:0 0 17px}h2{font-size:clamp(25px,5.7vw,38px);line-height:1.12;letter-spacing:-.025em;margin:0 0 10px}.lead,.helper{color:var(--muted);line-height:1.55;margin:0 0 18px}.helper{font-size:14px}input[type=text],input[type=email],textarea{width:100%;border:1px solid #cec8bc;border-radius:15px;padding:15px 16px;background:#fff;color:var(--ink);outline:none}textarea{min-height:130px;resize:vertical;line-height:1.5}.options{display:grid;gap:10px;margin:14px 0}.option{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:1px solid #cec8bc;border-radius:15px;background:#fff;cursor:pointer}.option:has(input:checked){border-color:var(--ink);background:#fbfaf7}.option input{width:auto;margin-top:3px}.multi{font-size:12px;color:var(--muted)}.detail{margin-top:18px;padding-top:16px;border-top:1px solid var(--soft)}.detail label{display:block;font-size:14px;font-weight:750;margin-bottom:7px}.detail p{font-size:13px;color:var(--muted);margin:0 0 9px}.category{background:#f8f6f1;border:1px solid var(--line);border-radius:16px;padding:16px}.category strong{display:block;margin-bottom:12px}.nav{display:flex;gap:10px;align-items:center;margin-top:20px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:720;cursor:pointer}.primary{background:var(--ink);color:#fff;margin-left:auto}.secondary{background:transparent;border:1px solid var(--line)}.loading{display:flex;gap:10px;align-items:center;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}.error{display:none;color:#8c2323;font-size:13px;margin-top:10px}.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:13px}.success .mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:26px;margin-bottom:22px}@media(max-width:520px){.shell{padding-top:16px}.card{min-height:calc(100vh - 148px)}}
</style></head><body><div class="shell"><div class="top"><div class="brand">Brand Decision System</div><div id="pl" class="progress-label"></div></div><div class="progress"><div id="pb"></div></div><main id="card" class="card"></main><div id="nav" class="nav"><button id="back" class="btn secondary">Atrás</button><span id="status" class="status">Guardado local</span><button id="next" class="btn primary">Continuar</button></div></div><script>
const API='/api/discovery-v06?key=bds-v06-test',STORE='bds-v06-semantic';
const intents=['job','trigger','barrier','customer_language','alternatives','mechanism','proof','category_tension','brand_best_self','principle'];
const labels={job:'Lo que buscaba el cliente',trigger:'Por qué fue en ese momento',barrier:'Qué podía cambiar la decisión',customer_language:'Cómo lo expresa el cliente',alternatives:'Qué habría hecho sin ti',mechanism:'Cómo produces valor',proof:'Qué evidencia tienes',category_tension:'Qué falla en la categoría',brand_best_self:'Tu mejor forma de trabajar',principle:'Lo que no sacrificarías'};
let S=JSON.parse(localStorage.getItem(STORE)||'{}');S.a||={};S.g||={};S.cat||=null;let i=Number(S.i||0);
const base=[{id:'intro',t:'intro',title:'Primero entendemos tu negocio. Luego preguntamos solo lo que necesitamos.',lead:'Esta versión genera cada pregunta y sus opciones a partir de tu categoría y una compra real.'},{id:'respondent_name',t:'text',s:'Sobre ti',q:'¿Cómo te llamas?',r:1},{id:'respondent_email',t:'email',s:'Sobre ti',q:'¿Quieres dejar un email de contacto?',lead:'Opcional.'},{id:'business_name',t:'text',s:'Tu negocio',q:'¿Cómo se llama tu negocio o proyecto?',r:1},{id:'offer',t:'textarea',s:'Tu negocio',q:'¿Qué vendes o qué haces por tus clientes?',lead:'Explícalo como se lo contarías a alguien que acaba de conocerte.',r:1},{id:'payer_mode',t:'choice',s:'Tu negocio',q:'¿Quién suele comprar o pagar por lo que ofreces?',o:['Personas','Empresas u organizaciones','Ambos','Todavía no tengo clientes'],r:1},{id:'recent_purchase',t:'text',s:'Una compra real',q:'Piensa en una venta reciente. ¿Qué compró exactamente ese cliente?',r:1},{id:'purchase_purpose',t:'textarea',s:'Una compra real',q:'¿Para qué lo quería?',lead:'Cuenta lo que recuerdes de esa compra concreta.',r:1},{id:'category',t:'category'}];
const tail=[{id:'feedback',t:'textarea',s:'Sobre esta prueba',q:'¿Hubo alguna pregunta u opción que no encajara con tu negocio o sonara rara?',lead:'Si todo tuvo sentido, escribe “todo encajó”.',r:1},{id:'review',t:'review',title:'Listo para enviar.',lead:'Guardaremos también las preguntas generadas para revisar si fueron realmente específicas y coherentes.'}];
const steps=()=>[...base,...intents.map(id=>({id,t:'gen'})),...tail],cur=()=>steps()[Math.min(i,steps().length-1)];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){S.i=i;localStorage.setItem(STORE,JSON.stringify(S));status.textContent='Guardado local'}
async function post(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||`HTTP ${r.status}`);return d}
const business=()=>({business_name:S.a.business_name||'',offer:S.a.offer||'',payer_mode:S.a.payer_mode||''}),episode=()=>({recent_purchase:S.a.recent_purchase||'',purpose:S.a.purchase_purpose||''});
function known(){const o={};for(const k of intents)if(S.a[k])o[k]=S.a[k];return o}function vocab(){return[S.a.offer,S.a.recent_purchase,S.a.purchase_purpose,...Object.values(known()).flatMap(v=>typeof v==='string'?[v]:(v?.selected||[]))].filter(Boolean).slice(0,20)}
async function ensureCat(){if(S.cat)return 1;card.innerHTML='<div class="loading"><span class="dot"></span> Entendiendo el negocio y la categoría…</div>';nav.style.visibility='hidden';try{S.cat=await post({action:'infer_context',...business(),recent_purchase:S.a.recent_purchase});save();return 1}catch(e){card.innerHTML=`<div class="eyebrow">No pudimos interpretar el contexto</div><h2>Prefiero detenerme antes que mostrar preguntas genéricas.</h2><p class="lead">${esc(e.message)}</p><button class="btn primary" onclick="S.cat=null;render()">Reintentar</button>`;return 0}finally{nav.style.visibility='visible'}}
async function ensureQ(id){if(S.g[id])return 1;card.innerHTML='<div class="loading"><span class="dot"></span> Preparando una pregunta para este caso…</div>';nav.style.visibility='hidden';try{S.g[id]=await post({action:'generate_question',strategic_intent:id,business_context:business(),category_profile:S.cat,purchase_episode:episode(),known_evidence:known(),respondent_vocabulary:vocab()});save();return 1}catch(e){card.innerHTML=`<div class="eyebrow">Esta pregunta no pasó la validación</div><h2>No te voy a mostrar un fallback genérico.</h2><p class="lead">${esc(e.message)}</p><button class="btn primary" onclick="delete S.g['${id}'];render()">Generar de nuevo</button>`;return 0}finally{nav.style.visibility='visible'}}
function baseInput(st){let v=S.a[st.id]??'';if(st.t==='text'||st.t==='email')return`<input id="f" type="${st.t}" value="${esc(v)}" placeholder="${st.r?'Escribe aquí…':'Opcional'}">`;if(st.t==='textarea')return`<textarea id="f" placeholder="Escribe con tus palabras…">${esc(v)}</textarea>`;if(st.t==='choice')return`<div class="options">${st.o.map(o=>`<label class="option"><input type="radio" name="c" value="${esc(o)}" ${v===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;return''}
function genInput(id,q){if(q.selection_mode==='free_text'){S.a[id]??='';return`<textarea id="dt" placeholder="Escribe lo que recuerdes. Si no recuerdas nada, dilo así.">${esc(S.a[id])}</textarea>`}S.a[id]??={selected:[],detail:''};const a=S.a[id],typ=q.selection_mode==='multi'?'checkbox':'radio';return`${q.selection_mode==='multi'?'<div class="multi">Puedes elegir varias.</div>':''}<div class="options">${q.options.map(o=>`<label class="option"><input type="${typ}" name="dc" value="${esc(o)}" ${a.selected.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div><div class="detail"><label>¿Qué viste, escuchaste o recuerdas en ese caso?</label><p>Las opciones orientan; tu ejemplo es la parte que nos ayuda a no inventar.</p><textarea id="dd" placeholder="Ejemplo o aclaración breve…">${esc(a.detail)}</textarea></div>`}
async function render(){const ss=steps();i=Math.min(i,ss.length-1);const st=ss[i],pct=st.t==='intro'?0:st.t==='review'?100:Math.round(Math.max(0,i-1)/(ss.length-2)*100);pb.style.width=pct+'%';pl.textContent=st.t==='intro'?'Inicio':st.t==='review'?'Listo para enviar':`${Math.max(0,i-1)} / ${ss.length-2}`;
if(st.t==='category'){if(!await ensureCat())return;card.innerHTML=`<div class="eyebrow">Antes de seguir</div><h2>Quiero comprobar que entendí tu negocio.</h2><div class="category"><strong>${esc(S.cat.confirmation||'')}</strong><label>Si esta categoría no te representa, corrígela:</label><input id="cat" type="text" value="${esc(S.cat.category_label||'')}"></div><p class="note">La categoría solo guía el lenguaje y las opciones. No la trataremos como evidencia sobre tu cliente.</p><div id="err" class="error">Necesitamos una categoría para continuar.</div>`;document.getElementById('cat').oninput=e=>{S.cat.category_label=e.target.value;S.g={};save()}}
else if(st.t==='gen'){if(!await ensureQ(st.id))return;const q=S.g[st.id];card.innerHTML=`<div class="context">${esc(q.context_cue||S.a.recent_purchase||'Compra reciente')}</div><div class="eyebrow">${esc(labels[st.id])}</div><h2>${esc(q.question)}</h2>${q.helper?`<p class="helper">${esc(q.helper)}</p>`:''}${genInput(st.id,q)}<div id="err" class="error">Selecciona o escribe una respuesta.</div>`;bindGen(st.id,q)}
else if(st.t==='intro'||st.t==='review')card.innerHTML=`<div class="eyebrow">${st.t==='intro'?'Discovery semántico · v0.6':'Antes de enviar'}</div><h1>${esc(st.title)}</h1><p class="lead">${esc(st.lead)}</p>`;
else{card.innerHTML=`<div class="eyebrow">${esc(st.s||'')}</div><h2>${esc(st.q)}</h2>${st.lead?`<p class="lead">${esc(st.lead)}</p>`:''}${baseInput(st)}<div id="err" class="error">Completa esta respuesta.</div>`;bindBase(st)}
back.style.visibility=i===0?'hidden':'visible';next.textContent=st.t==='review'?'Enviar respuestas':i===0?'Comenzar':'Continuar';status.style.visibility=(st.t==='intro'||st.t==='review')?'hidden':'visible';window.scrollTo({top:0,behavior:'smooth'})}
function bindBase(st){const f=document.getElementById('f');if(f)f.oninput=e=>{S.a[st.id]=e.target.value;if(['offer','recent_purchase'].includes(st.id)){S.cat=null;S.g={}}save()};document.querySelectorAll('input[name=c]').forEach(x=>x.onchange=e=>{S.a[st.id]=e.target.value;if(st.id==='payer_mode'){S.cat=null;S.g={}}save()})}
function bindGen(id,q){if(q.selection_mode==='free_text'){document.getElementById('dt').oninput=e=>{S.a[id]=e.target.value;save()};return}document.querySelectorAll('input[name=dc]').forEach(x=>x.onchange=e=>{const a=S.a[id];if(q.selection_mode==='multi')a.selected=e.target.checked?[...new Set([...a.selected,e.target.value])]:a.selected.filter(v=>v!==e.target.value);else a.selected=[e.target.value];save()});document.getElementById('dd').oninput=e=>{S.a[id].detail=e.target.value;save()}}
function valid(){const st=cur();if(['intro','review'].includes(st.t)||!st.r&&['text','email','textarea'].includes(st.t))return 1;if(st.t==='category')return !!S.cat?.category_label?.trim();if(st.t==='gen'){const q=S.g[st.id],a=S.a[st.id];return q?.selection_mode==='free_text'?!!a?.trim():!!a?.selected?.length}return!!String(S.a[st.id]||'').trim()}
async function submit(){next.disabled=back.disabled=true;next.textContent='Enviando…';try{await post({action:'submit',respondent_name:S.a.respondent_name,respondent_email:S.a.respondent_email,business_name:S.a.business_name,route_profile:{category_profile:S.cat},answers:{...S.a,__generated_questions:S.g},comprehension:{mode:'semantic_personalizer_v06'},metadata:{submitted_at:new Date().toISOString(),user_agent:navigator.userAgent}});localStorage.removeItem(STORE);nav.style.display='none';pb.style.width='100%';pl.textContent='Enviado';card.innerHTML='<div class="success"><div class="mark">✓</div><div class="eyebrow">Respuestas recibidas</div><h1>Gracias. Ya terminaste.</h1><p class="lead">También guardamos las preguntas y opciones generadas para revisar si realmente encajaron con este negocio.</p></div>'}catch(e){next.disabled=back.disabled=false;next.textContent='Intentar de nuevo';alert('No pudimos enviar. Tus respuestas siguen guardadas.')}}
const card=document.getElementById('card'),nav=document.getElementById('nav'),back=document.getElementById('back'),next=document.getElementById('next'),pb=document.getElementById('pb'),pl=document.getElementById('pl'),status=document.getElementById('status');next.onclick=async()=>{if(!valid()){const e=document.getElementById('err');if(e)e.style.display='block';return}if(cur().t==='review')return submit();i=Math.min(i+1,steps().length-1);save();render()};back.onclick=()=>{i=Math.max(0,i-1);save();render()};render();
</script></body></html>
